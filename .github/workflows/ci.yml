name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # No Supabase env vars needed here: pages check isSupabaseConfigured()
      # and render a setup notice instead of throwing when unset, so the
      # build doesn't require real (or placeholder) credentials to succeed.
      - run: pnpm build

      # Boot the actual production Next.js build and verify launch-critical
      # public/setup-safe routes render without production secrets, live-source
      # calls, or seeded venture data.
      - run: bash tests/integration/production_http_smoke.sh

      # Keep production-required/optional integration variables documented and
      # protect server-only cron credentials from accidental browser exposure.
      - run: bash tests/integration/deployment_env_contract.sh

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/integration/no_production_fixture_seeds.sh
      - run: bash tests/integration/no_synthetic_research_persistence.sh
      - run: bash tests/integration/no_simulated_investor_interest.sh
      - run: bash tests/integration/billing_webhook_retry_contract.sh
      - run: bash tests/integration/billing_checkout_subscription_contract.sh
      - run: bash tests/integration/monetization_selection_consistency_contract.sh
      - run: bash tests/integration/monitor_status_sync_contract.sh
      - run: bash tests/integration/build_persistence_consistency_contract.sh
      - run: bash tests/integration/rls_smoke_test.sh
